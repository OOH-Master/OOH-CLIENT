name: Build and Deploy

# Tag-based deploy. Reorder: build PRE shutdown-a → downtime ~5s umesto 1-2 min.
# Paralelno: web na server + APK/AAB na GitHub Releases.

on:
  push:
    tags:
      - '*'

permissions:
  contents: write    # za GitHub Releases (mobile artifacts)

env:
  IMAGE_NAME: "ooh-ui-img"
  CONTAINER_NAME: "ooh-ui"
  CONTAINER_PORT: "1235"
  API_BASE_URL: "https://ooh-api.appstersolutions.com/api/v1"

jobs:
  # 1. Flutter BLoC mock testovi (quality gate)
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Install dependencies
        run: |
          flutter pub get
          flutter gen-l10n
      - name: Run BLoC unit tests (mock data)
        run: flutter test test/features/auth/presentation/blocs/ test/features/discover/presentation/blocs/

  # 2. Mobile build (paralelno sa web) — APK + AAB → GitHub Releases
  build_mobile:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Install dependencies
        run: |
          flutter pub get
          flutter gen-l10n
      - name: Build APK
        run: flutter build apk --release --dart-define=API_BASE_URL=$API_BASE_URL --dart-define=APP_VERSION=${{ github.ref_name }}
      - name: Build AAB
        run: flutter build appbundle --release --dart-define=API_BASE_URL=$API_BASE_URL --dart-define=APP_VERSION=${{ github.ref_name }}
      - name: Rename artifacts
        run: |
          TAG="${{ github.ref_name }}"
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ooh-$TAG.apk
          mv build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/ooh-$TAG.aab
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Mobile build ${{ github.ref_name }}
          body: |
            **Automatska gradnja iz tag-a `${{ github.ref_name }}`**

            - APK — direktna instalacija na Android
            - AAB — App Bundle za Play Store

            API base URL: `${{ env.API_BASE_URL }}`
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab

  # 3. BUILD WEB DOCKER IMAGE — pre nego što ubije stari container (zero-downtime-ish)
  build_web:
    runs-on: mmui
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Build web Docker image (with version baked in)
        run: |
          echo "Building version: ${{ github.ref_name }}"
          docker build \
            --build-arg APP_VERSION=${{ github.ref_name }} \
            --build-arg APP_BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            -t $IMAGE_NAME:${{ github.ref_name }} .

  # 4. ATOMIC SWITCH — ubij stari container + pokreni novi (downtime ~5s)
  deploy_web:
    runs-on: mmui
    needs: build_web
    steps:
      - name: Atomic switch (stop old, start new)
        run: |
          docker rm -f $CONTAINER_NAME || true
          docker run --name=$CONTAINER_NAME -p $CONTAINER_PORT:80 -d $IMAGE_NAME:${{ github.ref_name }}
          sleep 5
          docker ps | grep $CONTAINER_NAME

  # 5. Smoke test
  smoke_test:
    runs-on: ubuntu-latest
    needs: deploy_web
    steps:
      - name: Ping frontend
        run: |
          sleep 10
          curl -fsSL -o /dev/null -w "HTTP %{http_code}\n" https://ooh-ui.appstersolutions.com/

  # 6. AUTO-ROLLBACK
  rollback:
    runs-on: mmui
    needs: smoke_test
    if: failure()
    steps:
      - name: Find previous image and rollback
        run: |
          PREVIOUS=$(docker images $IMAGE_NAME --format "{{.Tag}}" | grep -v '<none>' | grep -v "${{ github.ref_name }}" | head -1)
          if [ -z "$PREVIOUS" ]; then
            echo "::error::Nema prethodnog image-a za rollback"
            exit 1
          fi
          echo "🔄 Rollback na: $IMAGE_NAME:$PREVIOUS"
          docker rm -f $CONTAINER_NAME || true
          docker run --name=$CONTAINER_NAME -p $CONTAINER_PORT:80 -d $IMAGE_NAME:$PREVIOUS
          sleep 5
          docker ps | grep $CONTAINER_NAME
          echo "✅ ROLLBACK COMPLETE — vraćeno na $PREVIOUS"
