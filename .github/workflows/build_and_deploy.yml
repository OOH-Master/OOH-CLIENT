name: Build and Deploy

# Pokrece se na svaki git tag (npr. v1.0.X)
# Paralelno radi:
#   • Web deploy na server fakulteta (ooh-ui.appstersolutions.com)
#   • Mobile APK + AAB build → GitHub Releases (clickable download)

on:
  push:
    tags:
      - '*'

permissions:
  contents: write    # za kreiranje GitHub Releases (mobile artifacts)

env:
  IMAGE_NAME: "ooh-ui-img"
  CONTAINER_NAME: "ooh-ui"
  CONTAINER_PORT: "1235"
  API_BASE_URL: "https://ooh-api.appstersolutions.com/api/v1"

jobs:
  # ===================================================================
  # 1. UNIT TESTOVI — Flutter BLoC sa mock podacima (Mockito)
  # ===================================================================
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Install dependencies
        run: |
          flutter pub get
          flutter gen-l10n
      - name: Run BLoC unit tests (mock data)
        run: flutter test test/features/auth/presentation/blocs/ test/features/discover/presentation/blocs/

  # ===================================================================
  # 2. MOBILE BUILD — APK + AAB → GitHub Releases
  # ===================================================================
  build_mobile:
    runs-on: ubuntu-latest    # GitHub-hosted (treba Android SDK)
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Install dependencies
        run: |
          flutter pub get
          flutter gen-l10n
      - name: Build APK
        run: flutter build apk --release --dart-define=API_BASE_URL=$API_BASE_URL
      - name: Build AAB (App Bundle)
        run: flutter build appbundle --release --dart-define=API_BASE_URL=$API_BASE_URL
      - name: Rename artifacts with tag
        run: |
          TAG="${{ github.ref_name }}"
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ooh-$TAG.apk
          mv build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/ooh-$TAG.aab
      - name: Create GitHub Release with APK + AAB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Mobile build ${{ github.ref_name }}
          body: |
            **Automatska mobile gradnja iz tag-a `${{ github.ref_name }}`**

            Preuzmi:
            - **APK** — direktna instalacija na Android (sideload)
            - **AAB** — App Bundle za Play Store

            API base URL: `${{ env.API_BASE_URL }}`
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          draft: false
          prerelease: false

  # ===================================================================
  # 3. WEB DEPLOY — server fakulteta (Docker container sa nginx)
  # ===================================================================
  shutdown_old_container:
    runs-on: mmui
    needs: tests
    steps:
      - name: Stop old container (keep image for rollback)
        run: docker rm -f $CONTAINER_NAME || true

  build_web:
    runs-on: mmui
    needs: shutdown_old_container
    steps:
      - uses: actions/checkout@v4
      - name: Build web Docker image
        run: |
          echo "Building version: ${{ github.ref_name }}"
          docker build -t $IMAGE_NAME:${{ github.ref_name }} .

  deploy_web:
    runs-on: mmui
    needs: build_web
    steps:
      - name: Run new web container
        run: |
          docker run --name=$CONTAINER_NAME -p $CONTAINER_PORT:80 -d $IMAGE_NAME:${{ github.ref_name }}
          sleep 5
          docker ps | grep $CONTAINER_NAME

  # ===================================================================
  # 4. SMOKE TEST — verifikuje da je frontend live
  # ===================================================================
  smoke_test:
    runs-on: ubuntu-latest
    needs: deploy_web
    steps:
      - name: Ping frontend
        run: |
          sleep 10
          curl -fsSL -o /dev/null -w "HTTP %{http_code}\n" https://ooh-ui.appstersolutions.com/

  # ===================================================================
  # 5. AUTO-ROLLBACK — ako smoke padne, vraća prethodni image
  # ===================================================================
  rollback:
    runs-on: mmui
    needs: smoke_test
    if: failure()
    steps:
      - name: Find previous image and rollback
        run: |
          PREVIOUS=$(docker images $IMAGE_NAME --format "{{.Tag}}" | grep -v '<none>' | grep -v "${{ github.ref_name }}" | head -1)
          if [ -z "$PREVIOUS" ]; then
            echo "::error::Nema prethodnog image-a za rollback"
            exit 1
          fi
          echo "🔄 Rollback na: $IMAGE_NAME:$PREVIOUS"
          docker rm -f $CONTAINER_NAME || true
          docker run --name=$CONTAINER_NAME -p $CONTAINER_PORT:80 -d $IMAGE_NAME:$PREVIOUS
          sleep 5
          docker ps | grep $CONTAINER_NAME
          echo "✅ ROLLBACK COMPLETE — vraćeno na $PREVIOUS"
