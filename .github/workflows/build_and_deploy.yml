name: Build and Deploy

# Tag-based deploy. The image is built before the old container stops, so the outage is ~20s instead of 1-2 min.
# Two parallel branches: web image to our server, Android + iOS to GitHub Releases.

on:
  push:
    tags:
      - '*'

permissions:
  contents: write    # required to publish GitHub Releases (mobile artifacts)

env:
  IMAGE_NAME: "ooh-ui-img"
  CONTAINER_NAME: "ooh-ui"
  CONTAINER_PORT: "1235"
  API_BASE_URL: "https://ooh-api.appstersolutions.com/api/v1"

jobs:
  # 1. Flutter BLoC tests over mock data. Both branches below wait for this.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Install dependencies
        run: |
          flutter pub get
          flutter gen-l10n
      - name: Run BLoC unit tests (mock data)
        run: flutter test test/features/auth/presentation/blocs/ test/features/discover/presentation/blocs/

  # 2a. Android build, in parallel with web. APK + AAB go to a GitHub Release.
  build_android:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Install dependencies
        run: |
          flutter pub get
          flutter gen-l10n
      - name: Build APK
        run: flutter build apk --release --dart-define=API_BASE_URL=$API_BASE_URL --dart-define=APP_VERSION=${{ github.ref_name }}
      - name: Build AAB
        run: flutter build appbundle --release --dart-define=API_BASE_URL=$API_BASE_URL --dart-define=APP_VERSION=${{ github.ref_name }}
      - name: Rename artifacts
        run: |
          TAG="${{ github.ref_name }}"
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ooh-$TAG.apk
          mv build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/ooh-$TAG.aab
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Mobile build ${{ github.ref_name }}
          body: |
            **Automated build from tag `${{ github.ref_name }}`**

            - APK - direct install on Android
            - AAB - App Bundle for the Play Store

            API base URL: `${{ env.API_BASE_URL }}`
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab

  # 2b. iOS build. Runs after build_android because both upload to the same
  #     GitHub Release and two jobs must not race to create it.
  #     Unsigned on purpose - there is no Apple Developer account and no certificate.
  #     The IPA proves the build works; signing is all it needs to be installable.
  build_ios:
    runs-on: macos-latest          # Xcode only runs on macOS - the one job our Linux server cannot take
    needs: build_android
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Install dependencies
        run: |
          flutter pub get
          flutter gen-l10n
      - name: Build iOS without code signing
        run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL=$API_BASE_URL --dart-define=APP_VERSION=${{ github.ref_name }}
      - name: Package Runner.app into an unsigned IPA
        run: |
          TAG="${{ github.ref_name }}"
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "ooh-$TAG-unsigned.ipa" Payload
          ls -lh "ooh-$TAG-unsigned.ipa"
      - name: Attach the IPA to the existing GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ooh-*-unsigned.ipa

  # 2c. Build the web image on our server, before the old container is stopped.
  build_web:
    runs-on: mmui
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Build web Docker image (with version baked in)
        run: |
          echo "Building version: ${{ github.ref_name }}"
          docker build \
            --build-arg API_BASE_URL=$API_BASE_URL \
            --build-arg APP_VERSION=${{ github.ref_name }} \
            --build-arg APP_BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            -t $IMAGE_NAME:${{ github.ref_name }} .

  # 3. Swap containers: stop the old one, start the new one.
  deploy_web:
    runs-on: mmui
    needs: build_web
    steps:
      - name: Atomic switch (stop old, start new)
        run: |
          docker rm -f $CONTAINER_NAME || true
          docker run --name=$CONTAINER_NAME -p $CONTAINER_PORT:80 -d $IMAGE_NAME:${{ github.ref_name }}
          sleep 5
          docker ps | grep $CONTAINER_NAME

  # 4. Smoke test from outside: does the site answer over the public URL.
  smoke_test:
    runs-on: ubuntu-latest
    needs: deploy_web
    steps:
      - name: Ping frontend
        run: |
          sleep 10
          curl -fsSL -o /dev/null -w "HTTP %{http_code}\n" https://ooh-ui.appstersolutions.com/

  # 5. The smoke test passed, so this is the version to come back to.
  mark_good:
    runs-on: mmui
    needs: smoke_test
    steps:
      - name: Tag this image as last-known-good
        run: |
          docker tag $IMAGE_NAME:${{ github.ref_name }} $IMAGE_NAME:last-known-good
          echo "last-known-good now points at ${{ github.ref_name }}"

  # 6. Rollback, but only when the web deploy or its smoke test failed.
  #    Not `if: failure()` on purpose: a failing Android or iOS build
  #    must never revert a healthy web container.
  rollback:
    runs-on: mmui
    needs: [deploy_web, smoke_test]
    if: always() && (needs.deploy_web.result == 'failure' || needs.smoke_test.result == 'failure')
    steps:
      - name: Roll back to the last known good image
        run: |
          if ! docker image inspect $IMAGE_NAME:last-known-good > /dev/null 2>&1; then
            echo "::error::No last-known-good image yet - manual intervention required"
            exit 1
          fi
          docker rm -f $CONTAINER_NAME || true
          docker run --name=$CONTAINER_NAME -p $CONTAINER_PORT:80 -d $IMAGE_NAME:last-known-good
          sleep 5
          docker ps | grep $CONTAINER_NAME
          echo "Rollback complete, running last-known-good"
