name: Build and Deploy

# Tag-based deploy. The build runs BEFORE shutdown, cutting the outage window from 1-2 min to ~20s.
# Two parallel branches: web image to our server, APK/AAB to GitHub Releases.

on:
  push:
    tags:
      - '*'

permissions:
  contents: write    # required to publish GitHub Releases (mobile artifacts)

env:
  IMAGE_NAME: "ooh-ui-img"
  CONTAINER_NAME: "ooh-ui"
  CONTAINER_PORT: "1235"
  API_BASE_URL: "https://ooh-api.appstersolutions.com/api/v1"

jobs:
  # 1. Flutter BLoC tests over mock data - quality gate for both branches
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Install dependencies
        run: |
          flutter pub get
          flutter gen-l10n
      - name: Run BLoC unit tests (mock data)
        run: flutter test test/features/auth/presentation/blocs/ test/features/discover/presentation/blocs/

  # 2. Mobile build (parallel with web) - APK + AAB published as a GitHub Release
  build_mobile:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Install dependencies
        run: |
          flutter pub get
          flutter gen-l10n
      - name: Build APK
        run: flutter build apk --release --dart-define=API_BASE_URL=$API_BASE_URL --dart-define=APP_VERSION=${{ github.ref_name }}
      - name: Build AAB
        run: flutter build appbundle --release --dart-define=API_BASE_URL=$API_BASE_URL --dart-define=APP_VERSION=${{ github.ref_name }}
      - name: Rename artifacts
        run: |
          TAG="${{ github.ref_name }}"
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ooh-$TAG.apk
          mv build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/ooh-$TAG.aab
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Mobile build ${{ github.ref_name }}
          body: |
            **Automated build from tag `${{ github.ref_name }}`**

            - APK - direct install on Android
            - AAB - App Bundle for the Play Store

            API base URL: `${{ env.API_BASE_URL }}`
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab

  # 2b. iOS build - runs after build_mobile because both artifacts go into the
  #     SAME GitHub Release; two jobs must not race to create it.
  #     Unsigned on purpose: no Apple Developer account, no certificates. The IPA
  #     proves the build works; making it installable only needs signing.
  build_ios:
    runs-on: macos-latest          # Xcode only runs on macOS - the one job our Linux server cannot take
    needs: build_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Install dependencies
        run: |
          flutter pub get
          flutter gen-l10n
      - name: Build iOS without code signing
        run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL=$API_BASE_URL --dart-define=APP_VERSION=${{ github.ref_name }}
      - name: Package Runner.app into an unsigned IPA
        run: |
          TAG="${{ github.ref_name }}"
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "ooh-$TAG-unsigned.ipa" Payload
          ls -lh "ooh-$TAG-unsigned.ipa"
      - name: Attach the IPA to the existing GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ooh-*-unsigned.ipa

  # 3. BUILD the web image - runs before the old container is stopped
  build_web:
    runs-on: mmui
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Build web Docker image (with version baked in)
        run: |
          echo "Building version: ${{ github.ref_name }}"
          docker build \
            --build-arg API_BASE_URL=$API_BASE_URL \
            --build-arg APP_VERSION=${{ github.ref_name }} \
            --build-arg APP_BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            -t $IMAGE_NAME:${{ github.ref_name }} .

  # 4. ATOMIC SWITCH - stop the old container, start the new one
  deploy_web:
    runs-on: mmui
    needs: build_web
    steps:
      - name: Atomic switch (stop old, start new)
        run: |
          docker rm -f $CONTAINER_NAME || true
          docker run --name=$CONTAINER_NAME -p $CONTAINER_PORT:80 -d $IMAGE_NAME:${{ github.ref_name }}
          sleep 5
          docker ps | grep $CONTAINER_NAME

  # 5. Smoke test - external check that the site actually responds
  smoke_test:
    runs-on: ubuntu-latest
    needs: deploy_web
    steps:
      - name: Ping frontend
        run: |
          sleep 10
          curl -fsSL -o /dev/null -w "HTTP %{http_code}\n" https://ooh-ui.appstersolutions.com/

  # 6. AUTO-ROLLBACK - restores the previous image, but ONLY when the web deploy
  #    or its smoke test failed. Deliberately not `if: failure()`: a failing
  #    mobile or iOS build must never revert a healthy web container.
  rollback:
    runs-on: mmui
    needs: [deploy_web, smoke_test]
    if: always() && (needs.deploy_web.result == 'failure' || needs.smoke_test.result == 'failure')
    steps:
      - name: Find previous image and rollback
        run: |
          PREVIOUS=$(docker images $IMAGE_NAME --format "{{.Tag}}" | grep -v '<none>' | grep -v "${{ github.ref_name }}" | head -1)
          if [ -z "$PREVIOUS" ]; then
            echo "::error::No previous image found - manual intervention required"
            exit 1
          fi
          echo "🔄 Rolling back to: $IMAGE_NAME:$PREVIOUS"
          docker rm -f $CONTAINER_NAME || true
          docker run --name=$CONTAINER_NAME -p $CONTAINER_PORT:80 -d $IMAGE_NAME:$PREVIOUS
          sleep 5
          docker ps | grep $CONTAINER_NAME
          echo "✅ ROLLBACK COMPLETE - restored $PREVIOUS"
