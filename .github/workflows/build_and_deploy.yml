name: Build and Deploy

on:
  push:
    tags:
      - '*'

env:
  IMAGE_NAME: "ooh-ui-img"
  CONTAINER_NAME: "ooh-ui"
  CONTAINER_PORT: "1235"

jobs:
  # 1. Flutter unit testovi (BLoC mock data — discover_bloc + auth_bloc)
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Install dependencies
        run: |
          flutter pub get
          flutter gen-l10n
      - name: Run BLoC unit tests (mock data)
        run: flutter test test/features/auth/presentation/blocs/ test/features/discover/presentation/blocs/

  # 2. Ubij stari container (ALI ne briši image — treba za rollback)
  shutdown_old_container:
    runs-on: mmui
    needs: tests
    steps:
      - name: Stop old container (keep image for rollback)
        run: docker rm -f $CONTAINER_NAME || true

  # 3. Build novog Docker image-a
  build:
    runs-on: mmui
    needs: shutdown_old_container
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          echo "Building version: ${{ github.ref_name }}"
          docker build -t $IMAGE_NAME:${{ github.ref_name }} .

  # 4. Deploy novi container
  deploy_new_version:
    runs-on: mmui
    needs: build
    steps:
      - name: Run new container
        run: |
          docker run --name=$CONTAINER_NAME -p $CONTAINER_PORT:80 -d $IMAGE_NAME:${{ github.ref_name }}
          sleep 5
          docker ps | grep $CONTAINER_NAME

  # 5. Smoke test — verifikuje da frontend stvarno radi
  smoke_test:
    runs-on: ubuntu-latest
    needs: deploy_new_version
    steps:
      - name: Ping frontend
        run: |
          sleep 10
          curl -fsSL -o /dev/null -w "HTTP %{http_code}\n" https://ooh-ui.appstersolutions.com/

  # 6. AUTO-ROLLBACK — ako smoke padne, vraća prethodni image
  rollback:
    runs-on: mmui
    needs: smoke_test
    if: failure()
    steps:
      - name: Find previous image and rollback
        run: |
          PREVIOUS=$(docker images $IMAGE_NAME --format "{{.Tag}}" | grep -v '<none>' | grep -v "${{ github.ref_name }}" | head -1)
          if [ -z "$PREVIOUS" ]; then
            echo "::error::Nema prethodnog image-a za rollback"
            exit 1
          fi
          echo "🔄 Rollback na: $IMAGE_NAME:$PREVIOUS"
          docker rm -f $CONTAINER_NAME || true
          docker run --name=$CONTAINER_NAME -p $CONTAINER_PORT:80 -d $IMAGE_NAME:$PREVIOUS
          sleep 5
          docker ps | grep $CONTAINER_NAME
          echo "✅ ROLLBACK COMPLETE — vraćeno na $PREVIOUS"
