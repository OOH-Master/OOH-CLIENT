  #       with:
  #         flutter-version: ${{ env.FLUTTER_VERSION }}
  #         channel: stable
  #     - name: Build iOS (no signing — for inspection only)
  #       run: |
  #         flutter pub get
  #         flutter gen-l10n
  #         flutter build ios --release --no-codesign \
  #           --dart-define=API_BASE_URL="${{ vars.PROD_API_BASE_URL }}"
