name: Flutter Web CI/CD

# --------------------------------------------------------------------
# Triggers:
#   * push to main        → test → build → deploy to GitHub Pages
#   * pull_request        → test + build (no deploy)
#   * workflow_dispatch   → manual re-deploy
# --------------------------------------------------------------------
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write     # for gh-pages deploy
  pages: write
  id-token: write

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  # ===============================================================
  # 1) ANALYZE + TEST
  # ===============================================================
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Static analysis (flutter analyze)
        run: flutter analyze --no-fatal-infos
        continue-on-error: true     # demo project — don't block on lint warnings

      - name: Run tests
        run: flutter test --no-pub

  # ===============================================================
  # 2) BUILD WEB
  # ===============================================================
  build:
    name: Build Flutter web (release)
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Build web release
        run: |
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=API_BASE_URL="${{ vars.PROD_API_BASE_URL }}" \
            --dart-define=APP_VERSION="$(git rev-parse --short HEAD)"

      - name: Upload web artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  # ===============================================================
  # 3) DEPLOY to GitHub Pages
  # ===============================================================
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ===============================================================
  # 4) SMOKE TEST — verify deployed web app loads
  # ===============================================================
  smoke:
    name: Web smoke test
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify web app is reachable
        run: |
          URL="${{ vars.PROD_WEB_URL }}"
          echo "Checking $URL..."
          for i in {1..30}; do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if [ "$HTTP" = "200" ]; then
              echo "✅ Web app is live at $URL"
              exit 0
            fi
            echo "  attempt $i — got HTTP $HTTP, retrying in 10s..."
            sleep 10
          done
          echo "::error::Web app did not respond with HTTP 200"
          exit 1
